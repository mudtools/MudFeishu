name: .NET Build, Test and Publish

on:
  push:
    # 主干为 v3。branches 与 tags 是「任一匹配即触发」的独立过滤条件，
    # 即打 tag 不受分支过滤影响：在 v3 的提交上打 v3.x.y tag 同样会触发本工作流，
    # 并由 publish-nuget 推包（无需为 v3 另加 tag/分支规则）。
    branches: ["main", "master", "v3"]
    tags:
      - "v*" # 当推送版本标签时触发（如 v3.0.3）
  pull_request:
    branches: ["main", "master", "v3"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 2.0.7，留空则自动根据提交信息生成）"
        required: false
        default: ""
      dry_run:
        description: "试运行模式（不实际发布）"
        required: true
        default: "false"
        type: boolean

permissions:
  contents: write # 需要写权限来创建 tag 和 release
  id-token: write # OIDC：用于 NuGet Trusted Publishing 换取临时 API Key

env:
  # .NET SDK 版本（支持构建 netstandard2.0, net6.0, net8.0, net9.0, net10.0）。
  # 多版本必须用「多行」写法（每行一个版本）。不要写成空格分隔的
  # "6.0.x 8.0.x 9.0.x 10.0.x"：semver 会把空格当作 AND 连接符使其通过格式校验，
  # 随后 setup-dotnet 的版本解析只取首段并静默归一为单个 channel（6.0），
  # 即除 .NET 6 之外的版本实际来自 runner 预装镜像，一旦镜像调整就会以
  # 「testhost 无法启动」（VSTestTask 返回 false 却不记录错误）的形式炸开。
  DOTNET_VERSIONS: |
    6.0.x
    8.0.x
    9.0.x
    10.0.x
  CONFIGURATION: "Release" # 构建配置
  SOLUTION_FILE: "Mud.Feishu.slnx" # 解决方案文件

jobs:
  # 第一个作业：负责构建和测试（支持多操作系统）
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # 步骤1：检出你的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤2：安装.NET SDK（多版本支持）
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSIONS }}

      # 步骤2.5：依赖缓存新鲜度自检（CACHE-1）
      # 本地源（nuget.config → D:/Repos/MudHttpUtils/artifacts）仅存在于开发机/自托管环境，
      # 托管 runner 上脚本会输出 [SKIP] 并以 0 退出；自托管 runner 上则能真正拦截
      # 「组件同版本覆盖打包 → 下游缓存陈旧 → CS1750 假性断路」这一类事故。
      - name: Dependency cache freshness self-check (CACHE-1)
        shell: pwsh
        run: '& ./scripts/verify-build.ps1 -CacheCheckOnly'

      # 步骤3：还原依赖包
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      # 步骤4：编译整个解决方案（输出同时写入日志，供下一步做诊断断言）
      - name: Build
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'mudfeishu-build.log'
          dotnet build $env:SOLUTION_FILE --no-restore --configuration $env:CONFIGURATION --nologo 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { Write-Host '构建失败。' -ForegroundColor Red; exit 1 }
          "MUD_BUILD_LOG=$log" | Out-File -FilePath $env:GITHUB_ENV -Append

      # 步骤4.5：诊断白名单断言（与 scripts/verify-build.ps1 步骤 2 的判定口径保持一致）
      - name: Assert diagnostics whitelist
        shell: pwsh
        run: |
          $log = $env:MUD_BUILD_LOG
          $failed = $false
          function Assert-Zero([string]$name, [int]$count, [string]$hint = '') {
            if ($count -ne 0) {
              Write-Host "  [FAIL] $name = $count $hint" -ForegroundColor Red
              $script:failed = $true
            }
            else {
              Write-Host "  [ OK ] $name = 0" -ForegroundColor Green
            }
          }
          Assert-Zero 'NU1603 版本漂移'  (Select-String -Path $log -Pattern 'NU1603' -AllMatches).Count '声明版本与解析版本不一致'
          Assert-Zero 'CS1750 断路'      (Select-String -Path $log -Pattern 'CS1750' -AllMatches).Count '生成器默认值回归或依赖缓存陈旧'
          Assert-Zero 'HTTPCLIENT0xx'    (Select-String -Path $log -Pattern 'HTTPCLIENT0\d\d' -AllMatches).Count
          Assert-Zero 'MUD001/002'       (Select-String -Path $log -Pattern 'MUD00[12]' -AllMatches).Count
          Assert-Zero 'FORM0xx'          (Select-String -Path $log -Pattern 'FORM0\d\d' -AllMatches).Count
          Assert-Zero 'AOT001-007'       (Select-String -Path $log -Pattern 'AOT00[1-7]' -AllMatches).Count 'AOT006 已在 ns2.0/net6.0 豁免，net8+ 必须净零'
          if ($failed) { exit 1 }

      # 步骤4.6：配置面审计（R5/G1）。
      # 只断言「已删除的配置键/属性名不得在源码中复活」这一高精度桶（脚本的 $strictPatterns）；
      # R4 遗留的宽口径启发式模式仅告警（$warnPatterns），不阻断——详见 script 头部说明与
      # .docs/配置面可用性修复与收敛方案-R5.md §5.4（G-03 / RK13）。
      # 注意：不要把它并入上面的 -CacheCheckOnly 段，后者只在 Restore 之前跑且在托管 runner 上 [SKIP]。
      - name: Config key audit (strict)
        shell: pwsh
        run: '& ./scripts/audit-config-keys.ps1 -Strict'

      # P3-1：AOT 发布验证（仅 Linux，net8.0）
      - name: AOT Publish Verification
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 发布 AotVerification 示例进行 Smoke Test
          dotnet publish Demos/Mud.Feishu.AotVerification \
            --framework net8.0 \
            --configuration ${{ env.CONFIGURATION }} \
            --runtime linux-x64 \
            --self-contained true
          # 验证可执行文件存在
          test -f "Demos/Mud.Feishu.AotVerification/bin/${{ env.CONFIGURATION }}/net8.0/linux-x64/publish/Mud.Feishu.AotVerification" || exit 1
          echo "✅ AOT publish verification passed"

      # 步骤5：运行单元测试
      # 此前使用 --filter "FullyQualifiedName!~Mud.Feishu.Tests" 排除了 Mud.Feishu.Tests，
      # 而 AOT-2 的架构约束守卫 AotJsonSerializableCoverageTests 正位于该项目 —— 等于门禁对新加的反回归守卫无效。
      # 该项目 395 个用例在 net6.0/net8.0/net10.0 上均全绿（全部基于 Moq，无外部依赖），故恢复执行。
      #
      # 失败可读性（本次 CI 事故教训）：用例断言失败时 VSTestTask 返回 false 却不记录 MSBuild 错误
      # （MSB4181），MSBuild 末尾只会打印「生成失败 / 0 个错误」，并把整个构建里仅有的无关警告
      # （net6.0 测试工程传递引用 10.0.x 包的 NETStandardCompatError_*）列进失败摘要，极易误判为警告导致失败。
      # 因此保留完整测试日志，并在失败时高亮失败用例 / 中止信息。
      - name: Run tests
        id: test
        shell: pwsh
        run: |
          # TRX 与完整测试日志统一落到工作区下的 TestResults/，作为「上传测试结果」步骤的稳定路径。
          # 不再依赖 VSTest 的默认结果目录（各测试工程自己的 TestResults/）：路径分散且上传通配符
          # 与实际落盘位置容易不一致，出现「日志里跑了、制品里没有」的排查死路。
          $resultsDir = Join-Path $env:GITHUB_WORKSPACE 'TestResults'
          if (Test-Path $resultsDir) { Remove-Item $resultsDir -Recurse -Force }
          New-Item -ItemType Directory -Path $resultsDir -Force | Out-Null
          # 提前写入 GITHUB_ENV：即使本步骤后续失败，摘要/上传步骤（if: always()）也能拿到该路径。
          "MUD_TEST_RESULTS_DIR=$resultsDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          $log = Join-Path $resultsDir 'mudfeishu-test.log'

          # T-R2-04：启用真实 Redis 集成测试（Testcontainers.Redis，需 Docker daemon）。
          # ubuntu-latest runner 自带 Docker；GITHUB_ENV 仅对「后续步骤」生效，
          # 故同时设置进程级变量，使本步骤的 dotnet test 立即生效。
          if ('${{ matrix.os }}' -eq 'ubuntu-latest') {
            "MUDFEISHU_REDIS_TESTS=1" | Out-File -FilePath $env:GITHUB_ENV -Append
            $env:MUDFEISHU_REDIS_TESTS = '1'
          }
          else {
            Write-Host '[WARN] 非 Linux runner：未启用 Redis 集成测试（集成用例将被显式跳过，覆盖缺口见 scripts/verify-build.ps1 步骤 5）' -ForegroundColor Yellow
          }

          # --results-directory + --logger trx 的组合下，VSTest 为每个（测试工程, TFM）组合各落盘一个
          # TRX；同名时自动追加 [1]/[2] 后缀而非覆盖（实测 Mud.Feishu.slnx 的 8 个测试工程共
          # 20 个 (工程, TFM) 组合 —— Abstractions/Authentication/OpenTelemetry/Redis.IntegrationTests
          # 为 net8.0/net10.0（4×2），Redis/主包/Webhook/WebSocket 为 net6.0/net8.0/net10.0（4×3），
          # 结果集 20 个 TRX 全部保留）。故无需逐工程调用。
          dotnet test $env:SOLUTION_FILE --no-build --configuration $env:CONFIGURATION --results-directory $resultsDir --logger trx --verbosity normal 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host ''
            Write-Host '==== 测试阶段失败：以下为失败用例 / 中止信息（MSBuild 摘要中的“0 个错误”不代表成功）====' -ForegroundColor Red
            Select-String -Path $log -Pattern '^\s*(失败|Failed)\s+Mud\.|\[FAIL\]|测试运行失败|测试运行已中止|Test Run Failed|Test Run Aborted|(失败|Failed)! - (失败|Failed):\s*[1-9]' |
              ForEach-Object { Write-Host $_.Line.Trim() -ForegroundColor Red }
            Write-Host ''
            Write-Host '完整日志与 TRX 见制品 test-results-${{ matrix.os }}（TestResults/），用例明细见下一步摘要。' -ForegroundColor Yellow
            exit 1
          }

      # 步骤5.5：测试结果摘要（直接解析 TRX，locale 无关）
      # 目的：不下载制品也能在 Actions 日志里看到「哪个工程/TFM 失败、失败用例叫什么」。
      # 该步骤恒不改变 job 结论（if: always() 且从不以非零码退出）；失败判定仍由步骤 5 的退出码负责。
      - name: Test results summary
        if: always()
        shell: pwsh
        run: |
          $resultsDir = $env:MUD_TEST_RESULTS_DIR
          if (-not $resultsDir -or -not (Test-Path $resultsDir)) {
            Write-Host '[WARN] 未找到测试结果目录，跳过摘要。' -ForegroundColor Yellow
            exit 0
          }
          $trxFiles = @(Get-ChildItem -Path $resultsDir -Filter '*.trx' -File -Recurse -ErrorAction SilentlyContinue)
          if ($trxFiles.Count -eq 0) {
            Write-Host '[WARN] 未发现任何 TRX 文件（测试可能未执行），详见制品中的 mudfeishu-test.log。' -ForegroundColor Yellow
            exit 0
          }

          # TRX 的实际结构是 <TestRun><ResultSummary><Counters .../>；Counters 不在 Results 之下
          # （写成 $doc.TestRun.Results.ResultSummary.Counters 会恒为 $null，摘要变成全 0）。
          $failed = 0
          $passed = 0
          $total = 0
          $failedNames = New-Object System.Collections.Generic.List[string]
          Write-Host '---- 测试结果摘要（按 TRX 文件）----' -ForegroundColor Cyan
          foreach ($trx in ($trxFiles | Sort-Object Name)) {
            try {
              [xml]$doc = Get-Content -LiteralPath $trx.FullName -Raw -Encoding utf8
              $counters = $doc.TestRun.ResultSummary.Counters
              $f = if ($counters) { [int]$counters.failed } else { 0 }
              $p = if ($counters) { [int]$counters.passed } else { 0 }
              $t = if ($counters) { [int]$counters.total } else { 0 }
              $failed += $f
              $passed += $p
              $total += $t
              $color = if ($f -gt 0) { 'Red' } else { 'Green' }
              $state = if ($f -gt 0) { '[FAIL]' } else { '[ OK ]' }
              Write-Host ("  {0} {1,-44} 总计 {2,5}  通过 {3,5}  失败 {4,5}" -f $state, $trx.BaseName, $t, $p, $f) -ForegroundColor $color
              foreach ($r in @($doc.TestRun.Results.UnitTestResult)) {
                if ($r.outcome -eq 'failed') {
                  $name = if ($r.testName) { $r.testName } else { "$($r.TestMethod.className).$($r.TestMethod.name)" }
                  $failedNames.Add("[$($trx.BaseName)] $name")
                }
              }
            }
            catch {
              Write-Host "  [WARN] 解析 TRX 失败: $($trx.Name) - $_" -ForegroundColor Yellow
            }
          }
          Write-Host ''
          $summaryColor = if ($failed -gt 0) { 'Red' } else { 'Green' }
          Write-Host ("合计：总计 {0} / 通过 {1} / 失败 {2}（TRX {3} 个）" -f $total, $passed, $failed, $trxFiles.Count) -ForegroundColor $summaryColor
          if ($failedNames.Count -gt 0) {
            Write-Host '失败用例：' -ForegroundColor Red
            $shown = @($failedNames | Select-Object -First 50)
            $shown | ForEach-Object { Write-Host "    - $_" -ForegroundColor Red }
            if ($failedNames.Count -gt $shown.Count) {
              Write-Host "    ...（其余 $($failedNames.Count - $shown.Count) 条见制品中的 TRX）" -ForegroundColor Red
            }
          }
          Write-Host ''
          # 注意用单引号：矩阵表达式由 GitHub 在交给 pwsh 之前展开，若放进双引号字符串会被
          # PowerShell 当成非法插值并报 ParserError（“变量名称中应使用反引号加左花括号”）。
          # 另：本文件任何地方都不要在注释/字符串里写出插值起始符号加省略号的样式，
          # GitHub 的表达式扫描器会把它当成表达式而拒绝整个工作流文件（Unexpected symbol: '...'）。
          Write-Host '制品：test-results-${{ matrix.os }}（含 TestResults/*.trx 与 TestResults/mudfeishu-test.log）' -ForegroundColor Cyan

      # 步骤6：上传测试报告（TRX + 完整测试日志），测试失败时同样上传，便于下载排查
      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always() # 即使测试失败也执行
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/*.log
          if-no-files-found: warn
          retention-days: 7

  # 第二个作业：版本管理和创建 Release
  version-and-release:
    name: Version and Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      new_release: ${{ steps.version_info.outputs.new_release }}
      tag: ${{ steps.version_info.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install semantic-release
        run: |
          npm install -g semantic-release@23
          npm install -g @semantic-release/git@10
          npm install -g @semantic-release/changelog@6
          npm install -g @semantic-release/exec@6
          npm install -g conventional-changelog-conventionalcommits@7

      # 主干已切换到 v3：semantic-release 只在 "branches" 列出的分支上发布，
      # 当前分支不在列表内会直接以错误退出（version-and-release 失败 ⇒ new_release 永远拿不到值）。
      # main/master 保留以兼容旧主干。
      - name: Create semantic-release config
        run: |
          cat > .releaserc.json << 'EOF'
          {
            "branches": ["v3", "main", "master"],
            "plugins": [
              [
                "conventional-changelog-conventionalcommits",
                {
                  "types": [
                    { "type": "feat", "section": "✨ Features", "hidden": false },
                    { "type": "fix", "section": "🐛 Bug Fixes", "hidden": false },
                    { "type": "perf", "section": "⚡ Performance", "hidden": false },
                    { "type": "refactor", "section": "♻️ Code Refactoring", "hidden": false },
                    { "type": "docs", "section": "📝 Documentation", "hidden": false },
                    { "type": "test", "section": "✅ Tests", "hidden": false },
                    { "type": "build", "section": "📦 Build System", "hidden": false },
                    { "type": "ci", "section": "👷 CI/CD", "hidden": false },
                    { "type": "chore", "section": "🔧 Maintenance", "hidden": true }
                  ]
                }
              ],
              [
                "@semantic-release/changelog",
                {
                  "changelogFile": "CHANGELOG.md",
                  "changelogTitle": "# Changelog\n\nAll notable changes to this project will be documented in this file."
                }
              ],
              [
                "@semantic-release/exec",
                {
                  "prepareCmd": "sed -i 's/<Version>.*<\\/Version>/<Version>${nextRelease.version}<\\/Version>/' Directory.Build.props"
                }
              ],
              [
                "@semantic-release/git",
                {
                  "assets": ["Directory.Build.props", "CHANGELOG.md"],
                  "message": "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
                }
              ]
            ]
          }
          EOF

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            # dry_run 只做版本号/changelog 演练，不推 tag：new_release 必须为 false，
            # 否则 publish-nuget 会按条件尝试检出未推送的 v$VERSION tag 而 checkout 失败。
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "new_release=false" >> $GITHUB_OUTPUT
            else
              echo "new_release=true" >> $GITHUB_OUTPUT
            fi
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT

            # 更新 Directory.Build.props
            sed -i "s/<Version>.*<\/Version>/<Version>$VERSION<\/Version>/" Directory.Build.props

            # 生成 changelog
            echo "## v$VERSION ($(date '+%Y-%m-%d'))" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD >> RELEASE_NOTES.md || echo "- Manual release v$VERSION" >> RELEASE_NOTES.md

            # 提交并创建 tag
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Directory.Build.props
            git commit -m "chore(release): v$VERSION [skip ci]" || true
            git tag -a "v$VERSION" -F RELEASE_NOTES.md

            if [ "${{ inputs.dry_run }}" != "true" ]; then
              # 版本提交必须推回「发起本次手动运行的分支」，不能硬编码 master：
              # 主干是 v3 时，硬编码会把发布提交落到 master，v3 上永远看不到版本变更。
              git push origin "HEAD:$GITHUB_REF_NAME"
              git push origin "v$VERSION"
            fi
          else
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              DRY_RUN=true npx semantic-release --dry-run
              VERSION=$(npx semantic-release --dry-run 2>&1 | grep -oP 'The next release version is \K[0-9.]+')
              echo "version=${VERSION:-skip}" >> $GITHUB_OUTPUT
              echo "new_release=false" >> $GITHUB_OUTPUT
              echo "tag=" >> $GITHUB_OUTPUT
            else
              npx semantic-release
              VERSION=$(git describe --tags --abbrev=0 | sed 's/v//')
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              echo "new_release=true" >> $GITHUB_OUTPUT
              echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Extract version info
        id: version_info
        run: |
          VERSION="${{ steps.semantic.outputs.version }}"
          if [ "$VERSION" = "skip" ] || [ -z "$VERSION" ]; then
            echo "version=skip" >> $GITHUB_OUTPUT
            echo "new_release=false" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
          else
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "new_release=${{ steps.semantic.outputs.new_release }}" >> $GITHUB_OUTPUT
            echo "tag=${{ steps.semantic.outputs.tag }}" >> $GITHUB_OUTPUT
          fi

  # 第三个作业：负责打包和发布 NuGet 包
  # - 推送 v* tag 时发布（该 tag 可能是手动打的，也可能是 version-and-release push 的）
  #   主干是 v3，所以「在 v3 上打 tag」走的就是这条路径，且 tag 名即包版本唯一真源
  #   （见下方 Resolve package version）。
  # - 或手动 workflow_dispatch 且 version-and-release 判定有新版时发布
  # 用 always() 规避 needs 中被 skip 的 job（version-and-release 仅在 workflow_dispatch 执行）
  publish-nuget:
    name: Publish to NuGet
    needs: [build-and-test, version-and-release]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && needs.version-and-release.outputs.new_release == 'true'))
    environment: release # 需与 NuGet.org Trusted Publishing 策略里填的 Environment 一致

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # tag 触发：检出该 tag；手动触发：检出 master（version-and-release 已把新版本 push 到 master）。
          # 用 needs.version-and-release.outputs.tag 作优先，可精确锁定打包的 commit，避免竞态。
          ref: ${{ needs.version-and-release.outputs.tag != '' && needs.version-and-release.outputs.tag || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSIONS }}

      # 版本解析（tag 驱动的关键一步）：
      # 此前包版本只来自 Directory.Build.props 的 Version 节点，于是「打 v3.0.3 tag」实际打包出来的
      # 是 props 里的旧版本（如 3.0.2）——若该版本已在 nuget.org 上，--skip-duplicate 会静默成功，
      # 形成「tag 打了、日志全绿、新包没发出去」的假绿。故此处以 tag 名（或 dispatch 输入）为准，
      # 并用 -p:Version 同时喂给 build 与 pack，使程序集元数据与 nupkg 版本不可能漂移
      # （与 publish.bat 的说明口径一致：Directory.Build.props 固定 Version 时 --version-suffix 会被忽略）。
      # props 版本落后只告警不阻断，保证「打 tag 即发布」是一步操作。
      - name: Resolve package version
        id: pkgver
        shell: bash
        env:
          DISPATCH_VERSION: ${{ needs.version-and-release.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            SOURCE="tag $GITHUB_REF_NAME"
          else
            VERSION="$DISPATCH_VERSION"
            SOURCE="workflow_dispatch / version-and-release"
          fi
          # 只接受 semver（可带 -prerelease）：拦掉 v3、v-next 之类 tag 被当成包版本推上 nuget.org。
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::无法从「$SOURCE」解析出合法 semver 版本（得到 '$VERSION'）。请使用 v3.0.3 形式的 tag 或填写 version 输入。"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version : $VERSION  (来源：$SOURCE)"

          # 用 sed 而非 grep -P：-P 依赖 UTF-8 locale，在 locale 非 UTF-8 的环境里会直接报错，
          # 使 PROPS_VERSION 变空并误报「props 不一致」。
          PROPS_VERSION=$(sed -n 's|.*<Version>\([^<]*\)</Version>.*|\1|p' Directory.Build.props | head -n1 || true)
          if [ "$PROPS_VERSION" != "$VERSION" ]; then
            echo "::warning::Directory.Build.props 的 Version ($PROPS_VERSION) 与本次发布版本 ($VERSION) 不一致；已按 tag 覆盖打包（产物内部一致），建议随后把 props 同步为该版本。"
          fi

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --no-restore -p:Version=${{ steps.pkgver.outputs.version }}

      # 编译验证 Demos 项目
      - name: Build Demos
        run: |
          echo "Building all demo projects..."
          find ./Demos -name "*.csproj" -type f | while read project; do
            echo "Building: $project"
            dotnet build "$project" --configuration ${{ env.CONFIGURATION }}
          done

      # 打包：生成 .nupkg 文件。
      # -p:Version 必须与上一步 Build 完全一致：pack --no-build 只复用 bin 产物、再按属性生成 nuspec，
      # 两处版本不一致就会出现「包版本与程序集元数据不同」的成品。
      - name: Pack NuGet package
        run: dotnet pack ${{ env.SOLUTION_FILE }} --configuration ${{ env.CONFIGURATION }} --output ./nupkg --no-build -p:Version=${{ steps.pkgver.outputs.version }}

      # 关键新增：用 OIDC 换取临时 API Key（NuGet Trusted Publishing）
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          # 你的 NuGet.org 个人资料名（Profile name），不是邮箱、也不是组织名
          user: ${{ secrets.NUGET_USER }}

      # 发布：将包推送到 NuGet.org（临时 Key 有效期约 1 小时，绑定仓库/工作流）。
      # --skip-duplicate 的语义是「该版本已存在 ⇒ 视作成功」，退出码 0；
      # 因此把 push 日志落盘并显式提示被跳过的包，避免「什么都没发出去」却显示全绿。
      # 必须保留 pipefail：否则 tee 的 0 退出码会掩盖 dotnet nuget push 的真实失败。
      - name: Push to NuGet.org
        shell: bash
        run: |
          set -o pipefail
          # 日志写到 RUNNER_TEMP 而不是 ./nupkg：后者正是 push 的 glob 目录，
          # 把日志落进待推送目录会让「推送范围」取决于文件创建与 glob 展开的时序。
          LOG="$RUNNER_TEMP/nupkg-push.log"
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate 2>&1 | tee "$LOG"
          if grep -qiE 'already exists|conflict|skipping' "$LOG"; then
            echo "::warning::nuget.org 上已存在版本 ${{ steps.pkgver.outputs.version }}：被 --skip-duplicate 跳过的包没有实际推送，请确认是否本就需要重发同版本。"
            grep -iE 'already exists|conflict|skipping' "$LOG" | sed 's/^/    /' || true
          fi